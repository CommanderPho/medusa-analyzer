[project]
name = "medusa-analyzer"
version = "0.1.0"
description = "Medusa BCI analyzer application"
requires-python = ">=3.10,<3.14"
dependencies = [
    "neurokit2",
    "medusa-kernel",
]

[tool.uv.sources]
medusa-kernel = { path = "../medusa-kernel" }

[dependency-groups]
dev = [
    "cython>=3.2.4",
    "ipykernel>=7.2.0",
    "setuptools>=82.0.0",
    "wheel>=0.46.3",
]
